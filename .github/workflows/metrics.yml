# Generates the "Top Languages" card from every repo I contribute to,
# including private and organization repos (only the percentages are published).

name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          filename: metrics.languages.svg
          base: ""
          template: classic
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_categories: programming, markup
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_languages_analysis_timeout: 30
